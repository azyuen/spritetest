name: Install bookmark icons

on:
  push:
    paths:
      - '.github/workflows/install-bookmark-icons.yml'

permissions:
  contents: write

jobs:
  generate-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Generate PNG and ICO files from icon.svg
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64, io, re

          svg = Path('icon.svg').read_text()
          m = re.search(r'data:image/(?:jpeg|jpg|png);base64,([^"\']+)', svg)
          if not m:
              raise SystemExit('Could not find embedded source artwork in icon.svg')
          raw = base64.b64decode(m.group(1))
          img = Image.open(io.BytesIO(raw)).convert('RGB')
          w, h = img.size
          s = min(w, h)
          img = img.crop(((w-s)//2, (h-s)//2, (w+s)//2, (h+s)//2))

          outputs = [
              (16, 'favicon-16x16.png'),
              (32, 'favicon-32x32.png'),
              (180, 'apple-touch-icon.png'),
              (192, 'android-chrome-192x192.png'),
              (512, 'android-chrome-512x512.png'),
          ]
          for size, name in outputs:
              img.resize((size, size), Image.Resampling.LANCZOS).save(name, optimize=True)
          img.save('favicon.ico', format='ICO', sizes=[(16,16),(32,32),(48,48)])
          PY

      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add favicon.ico favicon-16x16.png favicon-32x32.png apple-touch-icon.png android-chrome-192x192.png android-chrome-512x512.png
          if git diff --cached --quiet; then
            echo "Icons already up to date"
          else
            git commit -m "Add Safari bookmark and app icon files"
            git push
          fi
